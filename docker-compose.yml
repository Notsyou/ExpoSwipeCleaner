services:
  expo-swipe-cleaner:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    network_mode: host
    restart: unless-stopped
    environment:
      # Set these in Portainer (stack > Environment variables) or a .env file next to this file. Never commit the token.
      - EXPO_TOKEN=${EXPO_TOKEN:-}
      - REACT_NATIVE_PACKAGER_HOSTNAME=${PACKAGER_HOSTNAME:-10.156.88.161}
